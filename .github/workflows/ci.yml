name: FinPal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test FinPal
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Install root dependencies
      - name: Install root dependencies
        run: npm ci

      # Install client dependencies
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Install server dependencies
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # Build frontend
      - name: Build frontend
        working-directory: client
        run: npm run build

      # Build backend
      - name: Build backend
        working-directory: server
        run: npm run build

      # Check repository status
      - name: CI completed
        run: echo "FinPal CI completed successfully!"
